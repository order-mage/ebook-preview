<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="eBook">
  <!-- Vector twin of the app icon: the glass is approximated with gradients
       (SVG has no backdrop-filter), so it stays crisp as a favicon. -->
  <defs>
    <linearGradient id="bed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset=".38" stop-color="#14b8a6"/>
      <stop offset=".72" stop-color="#0d9488"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".1" cy=".05" r=".6">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity=".8"/><stop offset="1" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".50"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#ffffff" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".54" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bed)"/>
  <rect width="512" height="512" fill="url(#glowA)"/>

  <!-- table -->
  <rect x="104" y="150" width="304" height="250" rx="56"
        fill="url(#pane)" stroke="#ffffff" stroke-opacity=".62" stroke-width="3"/>
  <!-- bookmark -->
  <path d="M212 82 h88 v238 l-44 -34 -44 34 Z" fill="url(#ribbon)"/>

  <rect width="512" height="512" fill="url(#sheen)"/>
</svg>
