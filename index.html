<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="eBook — rezervační kniha stolů pro restaurace" />
    <meta name="robots" content="noindex" />

    <!-- iOS home-screen app: Safari ignores the manifest for these, hence the
         apple-* duplicates. black-translucent + viewport-fit=cover let the app
         paint under the status bar; the layout already honours safe areas. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="eBook" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>eBook by OrderMage</title>
    <script type="module" crossorigin src="./assets/index-DlKGtat0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bkm7eKky.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // App shell cache — the app has to open with no signal, not just keep
      // running. Registered after load so it never delays first paint.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
